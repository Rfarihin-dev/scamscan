{id:'remote',weight:45,pattern:/\b(?:anydesk|teamviewer|remote (?:access|desktop)|share (?:your|the) screen|screen shar(?:e|ing)|kongsi(?:kan)? skrin|akses jauh)\b/gi,en:['Remote access or screen sharing','Remote access or screen sharing can expose your account and security codes.'],bm:['Akses jauh atau perkongsian skrin','Akses jauh atau perkongsian skrin boleh mendedahkan akaun dan kod keselamatan anda.']},
{id:'payment',weight:32,pattern:/\b(?:upfront fee|(?:processing|release|recovery|withdrawal|small) fee|pay\b[^.!?\n]{0,70}\b(?:fee|crypto|wallet)|gift cards?|crypto(?:currency)?|wallet address|yuran(?:\s+(?:pendahuluan|pemprosesan|pengeluaran))?|bayar|kripto|kad hadiah)\b|\b0x[a-fA-F0-9]{40}\b|\bbc1[a-zA-HJ-NP-Z0-9]{25,62}\b|\b[13][a-km-zA-HJ-NP-Z1-9]{25,34}\b/gi,en:['Payment or release fee','Advance fees, crypto transfers and gift cards are common ways scammers collect money.'],bm:['Bayaran atau yuran pelepasan','Yuran pendahuluan, pindahan kripto dan kad hadiah ialah cara biasa penipu mengutip wang.']},
{id:'offers',weight:26,pattern:/\b(?:guaranteed (?:profit|returns?)|free bonus|(?:recover(?:y)? (?:of )?lost funds)|recovery agent|claim your prize|you (?:won|have won)|keuntungan terjamin|bonus percuma|pemulihan dana(?: yang hilang)?|ejen pemulihan|tuntut hadiah|anda menang)\b/gi,en:['An unrealistic promise','Guaranteed returns, unexpected prizes and fund recovery promises can be bait.'],bm:['Janji yang tidak realistik','Pulangan terjamin, hadiah mengejut dan janji pemulihan dana boleh menjadi umpan.']},

const $=id=>document.getElementById(id);let lang='en',last=null,copyTimer;const LIMIT=50000;
/* SCORING — Pure functions; bounded input; contextual negation and parsed domains. */
function isSafetyStatement(text,start,end){
 const before=text.slice(Math.max(0,start-150),start).split(/[.!?;\n]|\b(?:but|however|tetapi|namun)\b/i).pop();
 return /(?:never|do not|don't|won't|will not|not to|jangan|tidak akan|tidak pernah)\s+(?:ask|request|share|give|send|disclose|reveal|pay|click|install|use|kongsi|berkongsi|meminta|beri|hantar|bayar|klik|pasang)\b[^.!?\n]{0,110}$/i.test(before);
}
function suspiciousHost(host){
 host=host.toLowerCase().replace(/\.$/,'').replace(/^www\./,'');
 if(host==='deriv.com'||host.endsWith('.deriv.com'))return false;
 return /^(?:\d{1,3}\.){3}\d{1,3}$/.test(host)||/^(?:bit\.ly|tinyurl\.com|t\.co|t\.me|wa\.me|is\.gd|cutt\.ly|rb\.gy|shorturl\.at|rebrand\.ly)$/.test(host)||/\.(?:xyz|top|click|buzz|work|zip|mov|tk|gq|cf)$/.test(host)||/der[i1l]v|derlv|derv|derivv|d[e3]riv|xn--/.test(host);
}
function analyze(raw){
 const text=raw.slice(0,LIMIT),flags=[],spans=[];
 for(const rule of RULES){let matches=[];
 if(rule.pattern){rule.pattern.lastIndex=0;for(const m of text.matchAll(rule.pattern)){if(isSafetyStatement(text,m.index,m.index+m[0].length))continue;matches.push({start:m.index,end:m.index+m[0].length});}}
 if(rule.kind==='links'){
 const re=/(?:https?:\/\/|www\.)[^\s<>"']+|\b(?:[a-z\d](?:[a-z\d-]*[a-z\d])?\.)+(?:com|net|org|xyz|top|click|buzz|work|zip|mov|tk|gq|cf|ly|co|me|gd|at|gy)(?:\/[^\s<>"']*)?|\b(?:\d{1,3}\.){3}\d{1,3}(?::\d+)?(?:\/[^\s<>"']*)?/gi;
 for(const m of text.matchAll(re)){const value=m[0].replace(/[),.;!?]+$/,'');try{const u=new URL(/^https?:/i.test(value)?value:'https://'+value);if(suspiciousHost(u.hostname))matches.push({start:m.index,end:m.index+value.length});}catch{}}
 }
 if(rule.kind==='sender'){
 for(const m of text.matchAll(/\b[A-Z0-9._%+-]+@([A-Z0-9.-]+\.[A-Z]{2,})\b/gi)){const host=m[1].toLowerCase();if((/der[i1l]v|derlv/i.test(m[0])||/\bderiv\b/i.test(text))&&host!=='deriv.com'&&!host.endsWith('.deriv.com'))matches.push({start:m.index,end:m.index+m[0].length});}
 }
 if(matches.length){flags.push(rule);for(const m of matches)spans.push({...m,id:rule.id});}
 }
 const score=Math.min(100,flags.reduce((n,r)=>n+r.weight,0)),level=score>=60?'high':score>=25?'suspicious':'safe';
 return {text,flags,spans,score,level};
}
/* RENDERING — User text is only inserted through textContent and text nodes. */
function list(id,items){$(id).replaceChildren(...items.map(s=>{const li=document.createElement('li');li.textContent=s;return li;}));}
function renderHighlights(result){
 const box=$('highlighted');box.replaceChildren();
 const events=new Map(),active=new Map();
 for(const span of result.spans){for(const [pos,delta] of [[span.start,1],[span.end,-1]]){if(!events.has(pos))events.set(pos,[]);events.get(pos).push({id:span.id,delta});}}
 const boundaries=[...new Set([0,result.text.length,...events.keys()])].sort((a,b)=>a-b);
 const frag=document.createDocumentFragment();
 for(let i=0;i<boundaries.length-1;i++){const start=boundaries[i],end=boundaries[i+1];for(const event of events.get(start)||[]){active.set(event.id,(active.get(event.id)||0)+event.delta);if(active.get(event.id)===0)active.delete(event.id);}
 const value=result.text.slice(start,end);if(!active.size){frag.append(document.createTextNode(value));continue;}
 const mark=document.createElement('mark');mark.textContent=value;mark.tabIndex=0;
 const ids=[...active.keys()],explanation=ids.map(id=>RULES.find(r=>r.id===id)[lang][1]).join(' ');
 mark.title=explanation;mark.setAttribute('aria-label',value+': '+explanation);
 for(const event of ['focus','pointerenter','click'])mark.addEventListener(event,()=>{$('flagDetail').textContent=explanation;});frag.append(mark);
 }
 box.append(frag);
}
function renderResult(result,announce=true){
 const t=I18N[lang];$('resultCard').classList.add('has-result');$('resultCard').classList.remove('is-stale');$('journeyInput').className='complete';$('journeyReview').className='current';$('empty').hidden=true;$('findings').hidden=false;$('status').textContent=t.analyzed;
 $('resultCard').style.setProperty('--risk',result.level==='high'?'var(--coral)':result.level==='suspicious'?'var(--amber)':'var(--green)');
 $('score').textContent=result.score;$('gauge').setAttribute('aria-valuenow',result.score);$('gauge').setAttribute('aria-label',t.scoreLabel);$('meter').style.strokeDashoffset=326.73*(1-result.score/100);
 $('verdict').textContent=t[result.level];$('verdictDesc').textContent=t[result.level+'Desc'];renderHighlights(result);
 $('flagDetail').textContent=result.flags.length?t.highlightHint:t.noFlags;
 $('flagsTitle').textContent=t.flagsTitle+' · '+result.flags.length;
 $('flags').replaceChildren(...result.flags.map((r,i)=>{const li=document.createElement('li');li.style.setProperty('--i',i);const icon=document.createElement('span');icon.className='flag-symbol';icon.textContent='!';icon.setAttribute('aria-hidden','true');const body=document.createElement('div'),title=document.createElement('strong'),desc=document.createElement('p');title.textContent=r[lang][0];desc.textContent=r[lang][1];body.append(title,desc);li.append(icon,body);return li;}));
 $('copy').disabled=false;$('copy').textContent=t.copy;
 $('resultCard').classList.remove('shake');if(result.level==='high'){void $('resultCard').offsetWidth;$('resultCard').classList.add('shake');}
 if(announce)$('announcer').textContent=t[result.level]+'. '+t.scoreLabel+': '+result.score+'/100. '+t.flagsTitle+': '+result.flags.length+'.';
}
function updateCount(){$('count').textContent=$('message').value.length.toLocaleString(lang==='bm'?'ms-MY':'en-US')+' / 50,000';}
function setLanguage(next){lang=next;const t=I18N[lang];document.documentElement.lang=lang==='bm'?'ms':'en';document.title='ScamScan — '+t.hero.join(' ');document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[el.dataset.t]);$('heroTitle').replaceChildren(document.createTextNode(t.hero[0]+' '));const em=document.createElement('em');em.textContent=t.hero[1];$('heroTitle').append(em);$('message').placeholder=t.placeholder;$('advicePanel').setAttribute('aria-label',t.safetyTitle);for(const key of ['en','bm'])$(key).setAttribute('aria-pressed',String(lang===key));list('checklist',t.advice);list('emergency',t.emergency);list('steps',t.steps);$('gauge').setAttribute('aria-label',t.scoreLabel);$('samples').replaceChildren(...t.sampleLabels.map((label,i)=>{const b=document.createElement('button');b.type='button';b.className='sample'+(i===4?' safe':'');b.setAttribute('aria-pressed',String($('message').value===t.samples[i]));const icon=document.createElement('b');icon.textContent=i===4?'✓':String(i+1).padStart(2,'0');icon.setAttribute('aria-hidden','true');b.append(icon,document.createTextNode(label));b.addEventListener('click',()=>{$('message').value=I18N[lang].samples[i];document.querySelectorAll('.sample').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));updateCount();runScan(true);});return b;}));$('inputError').textContent='';if(last){renderResult(last,false);if($('message').value!==last.text){$('status').textContent=t.stale;$('copy').disabled=true;$('resultCard').classList.add('is-stale');$('journeyInput').className='current';$('journeyReview').className='';}}updateCount();}
function runScan(scroll=false){const value=$('message').value,t=I18N[lang];if(!value.trim()||value.length>LIMIT){$('inputError').textContent=value.length>LIMIT?t.longError:t.emptyError;$('message').focus();return;}$('inputError').textContent='';last=analyze(value);renderResult(last);if(scroll&&matchMedia('(max-width:640px)').matches){$('resultCard').focus({preventScroll:true});$('resultCard').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'start'});}}
function report(){if(!last)return '';const t=I18N[lang];return [t.report,t[last.level]+' | '+t.scoreLabel+': '+last.score+'/100',t.flagsTitle+': '+last.flags.length,...last.flags.map(r=>'• '+r[lang][0]+': '+r[lang][1]),t.limits,t.next].join('\n');}
/* EVENTS — No persistence, network calls or third-party resources. */
$('scanForm').addEventListener('submit',e=>{e.preventDefault();runScan(true);});$('message').addEventListener('input',()=>{document.querySelectorAll('.sample').forEach(el=>el.setAttribute('aria-pressed','false'));updateCount();$('inputError').textContent='';if(last){$('status').textContent=I18N[lang].stale;$('announcer').textContent=I18N[lang].stale;$('copy').disabled=true;$('resultCard').classList.add('is-stale');$('journeyInput').className='current';$('journeyReview').className='';}});
$('clear').addEventListener('click',()=>{$('message').value='';last=null;$('resultCard').classList.remove('has-result','is-stale');$('journeyInput').className='current';$('journeyReview').className='';$('empty').hidden=false;$('findings').hidden=true;$('score').textContent='—';$('meter').style.strokeDashoffset=326.73;$('gauge').setAttribute('aria-valuenow','0');$('resultCard').style.setProperty('--risk','var(--muted)');setLanguage(lang);$('message').focus();});
$('en').addEventListener('click',()=>setLanguage('en'));$('bm').addEventListener('click',()=>setLanguage('bm'));
$('how').addEventListener('click',()=>$('howModal').showModal());$('closeHow').addEventListener('click',()=>$('howModal').close());$('closeCopy').addEventListener('click',()=>$('copyModal').close());
$('copy').addEventListener('click',async()=>{const value=report();try{if(!navigator.clipboard)throw Error('unavailable');await navigator.clipboard.writeText(value);$('copy').textContent=I18N[lang].copied;$('announcer').textContent=I18N[lang].copied;clearTimeout(copyTimer);copyTimer=setTimeout(()=>{$('copy').textContent=I18N[lang].copy;},2500);}catch{$('manualReport').value=value;$('copyModal').showModal();$('manualReport').focus();$('manualReport').select();}});
setLanguage('en');
</script>
</body>
</html>
